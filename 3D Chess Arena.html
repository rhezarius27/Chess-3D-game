function modal(h){$('#mb').innerHTML=h;$('#mod').classList.add('on')}function closeM(){$('#mod').classList.remove('on')}
const cls='<button class="b" style="width:100%;margin-top:8px" onclick="closeM()">Tutup</button>';
function mHow(){modal('<h2>How to Play</h2><ul style="padding-left:18px"><li>Klik bidak milikmu, lalu klik kotak hijau (langkah legal) atau merah (memakan bidak).</li><li>Seret mouse untuk memutar kamera, scroll untuk zoom, tombol Kamera untuk reset.</li><li>Semua aturan resmi berlaku: rokade, en passant, promosi, skak, skakmat, stalemate, remis.</li><li>Skor: pion 1, kuda 3, gajah 3, benteng 5, menteri 9. Skor hanya tambahan; pemenang ditentukan aturan catur.</li></ul>'+cls)}
function mStats(){modal(`<h2>Statistics</h2><div class="g2"><span>Pertandingan</span><b>${stats.games}</b><span>Menang</span><b>${stats.w}</b><span>Kalah</span><b>${stats.l}</b><span>Seri</span><b>${stats.d}</b><span>Bidak dimakan</span><b>${stats.caps}</b><span>Total waktu main</span><b>${Math.round(stats.time/60)} menit</b></div><button class="b" onclick="stats={games:0,w:0,l:0,d:0,caps:0,time:0};SV('cha_st',stats);mStats()">Reset</button>`+cls)}
function mSet(){modal(`<h2>Settings</h2><label>Tema</label><select onchange="set.theme=this.value;SV('cha_s',set);applyTheme()">${Object.entries({classic:'Classic Wooden Chess',neon:'Modern Neon Chess',royal:'Royal Chess Arena',mini:'Minimalist Chess Room'}).map(([k,v])=>`<option value="${k}"${set.theme==k?' selected':''}>${v}</option>`).join('')}</select><label><input type="checkbox" ${set.sfx?'checked':''} onchange="set.sfx=this.checked;SV('cha_s',set)"> Efek suara</label><br><label><input type="checkbox" ${set.mus?'checked':''} onchange="set.mus=this.checked;SV('cha_s',set);music()"> Musik latar</label>`+cls)}
function showSetup(m){sm=m;$('#n2r').style.display=m=='local'?'':'none';$('#dfr').style.display=m=='bot'?'':'none';$('#n1').value=prof.name;$('#sm').textContent=m=='bot'?'Lawan Robot':'Local 2 Player';show('setup')}let sm='bot';
function goStart(){prof.name=$('#n1').value.trim()||'Player 1';SV('cha_p',prof);startGame({mode:sm,hc:$('#hc').value,diff:+$('#df').value,n1:prof.name,n2:$('#n2').value.trim()||'Player 2'})}
function showCustom(){show('custom');$('#cn').value=prof.name;$('#cg').value=prof.g;$('#cs').value=prof.shirt;$('#ch').value=prof.hair;$('#ca').value=prof.acc;OC.autoRotate=false;setChar('w',prof);camTo([-2.6,.9,4.4],[-5.6,.6,0])}
function upd(){prof={name:$('#cn').value||'Player 1',g:$('#cg').value,shirt:$('#cs').value,hair:$('#ch').value,acc:$('#ca').value};SV('cha_p',prof);setChar('w',prof)}
function toMenu(){G=null;closeM();TW.length=0;setChar('w',prof);setChar('b',BOT);syncPieces(new Chess());marks();OC.autoRotate=true;camTo([0,7,12]);show('menu')}
// ---------- GAME ----------
function startGame(o){closeM();const h=o.hc,c=h=='w'?'b':'w';G={o,mode:o.mode,hc:h,diff:o.diff,chess:new Chess(),sel:null,mv:[],over:false,paused:false,el:0,score:{w:0,b:0},caps:{w:[],b:[]},busy:false,tk:0,pro:{}};
G.pro[h]={...prof,name:o.n1};G.pro[c]=o.mode=='bot'?BOT:{...P2,name:o.n2};setChar('w',G.pro.w);setChar('b',G.pro.b);syncPieces(G.chess);marks();
OC.autoRotate=false;C.position.set(0,16,24);OC.target.set(0,0,0);camTo(home(),[0,0,0],2.2);
$('#pw').innerHTML=pcH('w');$('#pb').innerHTML=pcH('b');panels();hist();refresh();show('hud');if(G.mode=='bot')maybeBot()}
const pcH=c=>`<span class="av" id="${c}av"></span><b id="${c}nm"></b> <small>${c=='w'?'(Putih)':'(Hitam)'}</small><div>Skor: <b id="${c}sc">0</b></div><div>Dimakan: <b id="${c}cn">0</b></div><div class="cp" id="${c}cp"></div>`;
function panels(){const sy={p:'♟',n:'♞',b:'♝',r:'♜',q:'♛'};['w','b'].forEach(c=>{const p=G.pro[c];$('#'+c+'nm').textContent=p.name;$('#'+c+'av').style.cssText=`--h:${p.hair};--s:${p.shirt}`;$('#'+c+'sc').textContent=G.score[c];$('#'+c+'cn').textContent=G.caps[c].length;
$('#'+c+'cp').innerHTML=G.caps[c].map(t=>`<i style="color:${c=='w'?'#111':'#fff'};text-shadow:0 0 3px ${c=='w'?'#fff':'#000'}">${sy[t]}</i>`).join('')})}
function pop(c,t){const e=document.createElement('span');e.className='pop';e.textContent=t;$('#p'+c).appendChild(e);setTimeout(()=>e.remove(),1300)}
function recalc(nc){const s={w:0,b:0},cp={w:[],b:[]};G.chess.history({verbose:true}).forEach(m=>{if(m.captured){s[m.color]+=VAL[m.captured];cp[m.color].push(m.captured)}});G.score=s;G.caps=cp;panels();if(nc&&VAL[nc.t])pop(nc.c,'+'+VAL[nc.t])}
function hist(){const h=G.chess.history();let t='';for(let i=0;i<h.length;i+=2)t+=`<div>${i/2+1}. ${h[i]} ${h[i+1]||''}</div>`;$('#hl').innerHTML=t;$('#hs').scrollTop=1e5}
function refresh(){const c=G.chess,t=c.turn(),n=G.pro[t].name;if(!G.over){$('#tn').textContent='Giliran: '+n+(t=='w'?' (Putih)':' (Hitam)');$('#st').textContent=c.in_check()?'Check!':'';}
$('#pw').classList.toggle('act',t=='w'&&!G.over);$('#pb').classList.toggle('act',t=='b'&&!G.over);if(!G.over){CH[t].base='think';CH[t=='w'?'b':'w'].base='idle';[CH.w,CH.b].forEach(o=>{if(!o.until)o.mood=o.base})}
$('#tm').textContent=tm()+' • Langkah: '+Math.ceil(c.history().length/2)}
const tm=()=>{const s=Math.floor(G.el);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
// markers
let MK=[];function marks(){MK.forEach(o=>{S.remove(o);o.geometry.dispose();o.material.dispose()});MK=[];if(!G)return;const add=(sq,col)=>{const o=new THREE.Mesh(new THREE.PlaneGeometry(.92,.92),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.55}));o.rotation.x=-Math.PI/2;o.position.copy(pos(sq));o.position.y=.215;S.add(o);MK.push(o)};
const c=G.chess;if(G.sel)add(G.sel,0xffd84a);G.mv.forEach(m=>add(m.to,m.captured||m.flags.includes('e')?0xff5a5a:0x46e08a));
if(c.in_check()){for(const r of c.board())for(const p of r)if(p&&p.type=='k'&&p.color==c.turn()){}const sq=kingSq(c);if(sq)add(sq,0xff2a2a)}}
function kingSq(c){let r=null;c.board().forEach((row,i)=>row.forEach((p,f)=>{if(p&&p.type=='k'&&p.color==c.turn())r='abcdefgh'[f]+(8-i)}));return r}
// input
const rc=new THREE.Raycaster(),pl=new THREE.Plane(new V3(0,1,0),-.2),pt=new V3();let pd=null;
R.domElement.addEventListener('pointerdown',e=>pd=[e.clientX,e.clientY]);
R.domElement.addEventListener('pointerup',e=>{if(!pd||Math.hypot(e.clientX-pd[0],e.clientY-pd[1])>5)return;rc.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),C);if(!rc.ray.intersectPlane(pl,pt))return;const f=Math.floor(pt.x+4),rk=Math.round(4.5-pt.z);if(f<0||f>7||rk<1||rk>8)return;click('abcdefgh'[f]+rk)});
function click(sq){if(!G||G.over||G.paused||G.busy||G.rev)return;const c=G.chess,t=c.turn();if(G.mode=='bot'&&t!=G.hc)return;
const m=G.mv.filter(x=>x.to==sq);if(G.sel&&m.length){if(m[0].promotion)promoQ(p=>tryMove(G.sel,sq,p));else tryMove(G.sel,sq);return}
const p=c.get(sq);if(p&&p.color==t){G.sel=sq;G.mv=c.moves({square:sq,verbose:true})}else{G.sel=null;G.mv=[]}marks()}
function promoQ(cb){window._pc=cb;modal('<h3>Promosi pion</h3><div class="row">'+[['q','♛ Menteri'],['r','♜ Benteng'],['b','♝ Gajah'],['n','♞ Kuda']].map(a=>`<button class="b" onclick="closeM();_pc('${a[0]}')">${a[1]}</button>`).join('')+'</div>')}
function tryMove(f,t,p){const m=G.chess.move({from:f,to:t,promotion:p||'q'});if(m)afterMove(m)}
function afterMove(m){doMove(m);G.sel=null;G.mv=[];const c=G.chess,me=m.color,op=me=='w'?'b':'w';recalc(m.captured?{c:me,t:m.captured}:null);hist();
if(m.captured){setMood(me,'happy',1800);setMood(op,'sad',1800)}else setMood(me,'move',900);
SF[m.captured?'cap':'move']();
if(c.in_checkmate()){SF.mate();setMood(op,'shock',2500);end('Checkmate',me)}
else if(c.in_draw()||c.in_stalemate()||c.in_threefold_repetition()||c.insufficient_material())end(c.in_stalemate()?'Stalemate':c.insufficient_material()?'Insufficient Material':c.in_threefold_repetition()?'Threefold Repetition':'Draw (aturan 50 langkah)',null);
else if(c.in_check()){SF.check();setMood(op,'shock',1800)}
refresh();marks();if(!G.over)maybeBot()}
function end(reason,w){G.over=true;G.tk++;const l=w=='w'?'b':'w';stats.games++;stats.time+=G.el;stats.caps+=G.caps.w.length+G.caps.b.length;const hw=w==G.hc;if(!w)stats.d++;else if(G.mode=='bot'&&!hw)stats.l++;else stats.w++;SV('cha_st',stats);
$('#st').textContent=reason;$('#tn').textContent=w?G.pro[w].name+' menang!':'Pertandingan seri';
setTimeout(()=>{if(!G||!G.over)return;[CH.w,CH.b].forEach(o=>o.until=0);if(w){CH[w].base=CH[w].mood='win';CH[l].base=CH[l].mood='lose';SF[G.mode=='bot'&&!hw?'lose':'win']();const x=CH[w].g.position.x;camTo([x*.35,3.5,7.5],[x*.8,1,0],2)}else{CH.w.base=CH.w.mood=CH.b.base=CH.b.mood='draw';SF.lose()}
const sc=w||'w',p=G.pro[sc];$('#eav').style.cssText=`--h:${p.hair};--s:${p.shirt}`;$('#ew').textContent=w?'Pemenang: '+G.pro[w].name:'Seri';$('#er').textContent='Alasan: '+reason+(w&&reason!='Checkmate'&&reason!='Resign'?'':'')+(w?' • Kalah: '+G.pro[l].name:'');
const g=$('#eg');g.innerHTML='';[['Skor Putih',G.score.w],['Skor Hitam',G.score.b],['Bidak dimakan',G.caps.w.length+G.caps.b.length],['Durasi',tm()],['Langkah',Math.ceil(G.chess.history().length/2)]].forEach(([a,b])=>{const x=document.createElement('span'),y=document.createElement('b');x.textContent=a;y.textContent=b;g.append(x,y)});show('hud','end')},1500)}
function resignQ(){if(!G||G.over)return;modal('<h3>Menyerah?</h3><div class="row"><button class="b" onclick="closeM()">Batal</button><button class="b p" onclick="closeM();resign()">Ya, menyerah</button></div>')}
function resign(){const t=G.mode=='bot'?G.hc:G.chess.turn();end('Resign',t=='w'?'b':'w')}
function pause(){if(!G||G.over)return;G.paused=true;modal('<h3>Permainan dijeda</h3><button class="b p" style="width:100%" onclick="G.paused=false;closeM()">Lanjutkan</button>')}
function undo(){if(!G||G.over||G.busy||G.rev)return;const c=G.chess;let n=G.mode=='bot'?(c.turn()==G.hc?2:1):1;while(n--&&c.history().length)c.undo();G.tk++;G.sel=null;G.mv=[];TW.length=0;syncPieces(c);recalc();hist();refresh();marks();if(G.mode=='bot')maybeBot()}
function review(){const g0=G,hs=G.chess.history({verbose:true});g0.rev=true;show('hud');syncPieces(new Chess());let i=0;const go=()=>{if(G!==g0)return;if(i>=hs.length){g0.rev=false;setTimeout(()=>{if(G===g0)show('hud','end')},1200);return}const m=hs[i++];doMove(m);SF[m.captured?'cap':'move']();setMood(m.color,m.captured?'happy':'move',800);setTimeout(go,950)};setTimeout(go,600)}
// ---------- AI (alpha-beta) ----------
const PV={p:100,n:320,b:330,r:500,q:900,k:0};
function evalPos(c){let s=0;c.board().forEach((row,i)=>row.forEach((p,f)=>{if(!p)return;const cen=3.5-Math.max(Math.abs(f-3.5),Math.abs(i-3.5));let v=PV[p.type];if(p.type=='p')v+=(p.color=='w'?6-i:i-1)*8+cen*4;else if(p.type!='k'&&p.type!='r')v+=cen*8;s+=p.color=='w'?v:-v}));return c.turn()=='w'?s:-s}
function nega(c,d,a,b,ply){if(!d)return evalPos(c);const ms=c.moves();if(!ms.length)return c.in_check()?-1e5+ply:0;ms.sort((x,y)=>y.includes('x')-x.includes('x'));for(const m of ms){c.move(m);const s=-nega(c,d-1,-b,-a,ply+1);c.undo();if(s>a){a=s;if(a>=b)break}}return a}
function maybeBot(){if(G.mode!='bot'||G.over||G.chess.turn()==G.hc)return;const tk=++G.tk,c=G.chess,dp=[1,2,3,4][G.diff],lim=[0,0,2500,4000][G.diff],noise=[150,15,0,0][G.diff],t0=performance.now(),roots=c.moves().sort((x,y)=>y.includes('x')-x.includes('x'));let i=0,best=roots[0],bs=-1e9;G.busy=true;
const step=()=>{if(G.tk!=tk||G.over)return;if(G.paused){setTimeout(step,200);return}
if(i>=roots.length||(i>0&&performance.now()-t0>lim&&G.diff>1)){const w=Math.max(0,800-(performance.now()-t0));setTimeout(()=>{if(G.tk!=tk||G.over)return;G.busy=false;const m=c.move(best);if(m)afterMove(m)},w);return}
const m=roots[i++];c.move(m);let s=-nega(c,dp-1,noise?-1e9:-1e9,noise?1e9:-bs,1)+Math.random()*noise;c.undo();if(s>bs){bs=s;best=m}setTimeout(step,0)};
if(G.diff==0&&Math.random()<.3){best=roots[Math.floor(Math.random()*roots.length)];i=roots.length}setTimeout(step,300)}
// ---------- LOOP ----------
let last=performance.now(),lt='';
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
for(let i=TW.length-1;i>=0;i--){const o=TW[i];o.t+=dt;const p=Math.min(1,o.t/o.d);o.fn(p);if(p>=1){TW.splice(i,1);o.done&&o.done()}}
if(CT){CT.k+=dt/CT.d;const k=Math.min(1,CT.k),e=k*k*(3-2*k);C.position.lerpVectors(CT.a,CT.p,e);OC.target.lerpVectors(CT.b,CT.t,e);if(k>=1){CT=null;OC.enabled=true}}
Object.values(CH).forEach(o=>animC(o,dt));
if(G&&!G.paused&&!G.over&&!G.rev){G.el+=dt;const t=tm();if(t!=lt){lt=t;$('#tm').textContent=t+' • Langkah: '+Math.ceil(G.chess.history().length/2)}}
OC.update();R.render(S,C)}
applyTheme();toMenu();C.position.set(0,7,12);CT=null;OC.enabled=true;requestAnimationFrame(loop);
</script></body></html>
